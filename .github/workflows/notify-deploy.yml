name: Notify deploy repo of dev update

on:
  push:
    branches: [dev]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch submodule-updated event to transcendence_deploy
        env:
          PAT: ${{ secrets.DEPLOY_SYNC_PAT }}
        run: |
          curl -sSf -X POST \
            -H "Authorization: token ${PAT}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/222transcendence/transcendence_deploy/dispatches \
            -d '{"event_type":"submodule-updated","client_payload":{"repo":"transcendence_backend"}}'
